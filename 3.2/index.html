<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>Hello Hi</h1>

<h2>voornaam</h2>
<input type="text" pattern="[A-Za-z\s]+" required>

<h2>achternaam</h2>
<input type="text" pattern="[A-Za-z\s]+" required>

<h2>aanhef</h2>
<input type="radio" name="Aanhef">Dhr.
<input type="radio" name="Aanhef">Mevr.
<input type="radio" name="Aanhef">Anders.

<h2>Straat met huisnummer</h2>
<input type="text" placeholder="Stationsweg 12" pattern="[0-9-A-Za-z\s]+" required>

<h2>Postcode</h2>
<input type="text" placeholder="1234 AB" pattern="[0-9-A-Za-z\s]+" required>

<h2>woonplaats</h2>
<input type="text" pattern="[A-Za-z\s]+" required>

<h2>land</h2>
<input type="text" pattern="[A-Za-z\s]+" required>

<h2>IBAN-nummer</h2>
<input type="text" pattern="[0-9-A-Za-z\s]+ required" placeholder="NL91ABNA0417164300">

<h2>Type abonnement</h2>
<input type="radio" name="abonnement">Mobiel
<input type="radio" name="abonnement">Glasvezel
<input type="radio" name="abonnement">TV

<h2>Datum van ingang abonnement</h2>
<input type="date">

<h2>looptijd abonnement</h2>
<input type="date">

<h2>aantal gebruikers op het abonnement</h2>
<input type="radio" name="gebruikers">1
<input type="radio" name="gebruikers">2
<input type="radio" name="gebruikers">3
<input type="radio" name="gebruikers">4

<h2>E-mailadres</h2>
<input type="email" pattern="[0-9-A-Za-z\s]+" required>

<h2>wachtwoord</h2>
<input type="password" pattern="[0-9-A-Za-z\s]+" required>

<h2>verzend knop</h2>
<button type="submit">verzenden</button>

    
</body>
</html>
